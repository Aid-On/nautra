[package]
name = "nautra"
version = "0.1.0"
almide = "0.70.0"
description = "Build, ship and run WebAssembly workloads"
license = "Apache-2.0"
repository = "https://github.com/Aid-On/nautra"

# Native code can do anything, so calling the engine needs every capability.
[permissions]
allow = ["FS.read", "FS.write", "IO", "Env", "Time", "Net", "Proc", "Rand", "Fan", "Abort"]
# What nautra may do to other processes: ask `ps` when one was born (to tell
# a background run from another process that later got its pid), and signal
# a background run to stop it.
proc = ["ps", "kill"]

# The only native code is the engine: wasmtime, and the two parsers it needs
# (the wasm binary format for `inspect`, TOML for the Nautrafile). ureq is a
# stopgap for sending a binary request body, which Almide 0.70's http client
# cannot do yet; see native/engine/upload.rs.
[native-deps]
wasmtime = "49.0.4"
wasmtime-wasi = "49.0.4"
wasmtime-wasi-http = { version = "49.0.4", features = ["component-model-async"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
tokio = { version = "1", features = ["net", "signal", "time", "rt", "macros"] }
wasmparser = "0.258.3"
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
